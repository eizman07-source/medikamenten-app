<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Roboto, Arial, sans-serif; margin: 0; background: #f4f5f7; color: #1c1e21; }
  header { background: #1f4e79; color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; margin: 0; }
  main { max-width: 720px; margin: 0 auto; padding: 12px; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 9px 14px; background: #1f4e79; color: #fff; cursor: pointer; }
  button.sek { background: #e3e6ea; color: #1c1e21; }
  button.gefahr { background: #b3261e; }
  button:disabled { opacity: .5; }
  .karte { background: #fff; border-radius: 10px; margin-bottom: 10px; border-left: 6px solid #9aa0a6; position: relative; }
  .karte.rot { border-left-color: #b3261e; }
  .karte.orange { border-left-color: #e08a00; }
  .karte.gruen { border-left-color: #2e7d32; }
  .reihe { display: flex; align-items: stretch; }
  .griff { flex: none; width: 36px; min-height: 44px; padding: 0; margin: 0; border: 0; border-radius: 10px 0 0 0;

  .name { display: block; font-weight: 600; font-size: 16px; }

  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 6px 10px; min-height: 36px;
    border: 1px solid #c4c7cc; border-radius: 18px; background: #fff; color: #1c1e21; }
  .pop { display: none; position: absolute; left: 0; top: calc(100% + 4px); z-index: 20; width: max-content; max-width: 260px;

  .detail { padding: 0 12px 12px 36px; border-top: 1px solid #eceef1; }

  .tagesliste { margin-top: 10px; padding: 10px 12px; background: #f4f5f7; border-radius: 8px; font-size: 14px; }

  .tagesliste .m { display: inline-block; width: 8px; height: 8px; flex: none; }
  .box { background: #fff; border-radius: 10px; padding: 12px; margin-top: 16px; }

  label { display: block; font-size: 13px; margin: 10px 0 3px; color: #444; }
  input[type=text], input[type=number], input[type=date], textarea {
    width: 100%; font: inherit; padding: 8px; border: 1px solid #c4c7cc; border-radius: 6px; background: #fff; }

  .zeile > div { flex: 1; }
  .check { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; font-size: 14px; }
  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); overflow-y: auto; padding: 12px; }
  #formular { background: #fff; max-width: 560px; margin: 10px auto; border-radius: 12px; padding: 14px; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #202124; color: #fff;
    padding: 10px 16px; border-radius: 8px; display: none; max-width: 90%; z-index: 10; }
  #toast.fehler { background: #b3261e; }

<body>

<div id="overlay"><div id="formular">
  <h2 id="formTitel" style="margin-top:0"></h2>
  <input type="hidden" id="f_id">
  <input type="hidden" id="f_art" value="rezept">
  <div id="artWahl">
    <div class="l">Art</div>
    <div class="seg">
      <button type="button" data-art="rezept" aria-pressed="true">Rezept</button>
      <button type="button" data-art="aufgabe" aria-pressed="false">Aufgabe</button>
      <button type="button" data-art="termin" aria-pressed="false">Termin</button>
    </div>
  </div>
  <label for="f_name" id="l_name">Medikament</label><input type="text" id="f_name">
  <label for="f_gruppe">Gruppe (optional, z. B. "Slenyto")</label><input type="text" id="f_gruppe" list="gruppen" autocomplete="off"><datalist id="gruppen"></datalist>

  <div class="zeile">

      <div><label for="f_vb_titel">Aufgabe</label><input type="text" id="f_vb_titel"></div>

    </div>

  <label for="f_notiz">Notiz</label><textarea id="f_notiz"></textarea>

</div></div>
<div id="zugang" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);overflow-y:auto;padding:12px;z-index:5">
  <div style="background:#fff;max-width:560px;margin:10px auto;border-radius:12px;padding:14px">
    <h2 style="margin-top:0">Zugang einrichten</h2>
    <p class="info">Wird nur auf diesem Gerät im Browser gespeichert.</p>
    <label for="z_url">Web-App-URL (endet auf /exec)</label><input type="text" id="z_url" autocomplete="off">
    <label for="z_key">Zugangsschlüssel</label><input type="text" id="z_key" autocomplete="off">
    <div class="aktionen">
      <button onclick="speichereZugang()">Speichern</button>
      <button class="sek" id="z_abbruch" onclick="$('zugang').style.display='none'">Abbrechen</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
var state = { medikamente: [], einstellungen: { vorlauf: 7, buendel: 14 }, heute: '', kalender: null, ereignisse: [] };
var offen = {};      // aufgeklappte Karten (Schlüssel)
var popAn = null;    // Karte, deren Dosierungs-Feld angeheftet ist

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function $(id) { return document.getElementById(id); }

var toastTimer = null;
function meldung(text, istFehler) {
  var t = $('toast');
  t.textContent = text;
  t.className = istFehler ? 'fehler' : '';
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, istFehler ? 6000 : 2500);
}
function fehler(e) { meldung(e && e.message ? e.message : String(e), true); }

/* ---- Zugang (nur im Browser dieses Geräts gespeichert) ---- */
function zugang() {
  try {
    return { url: localStorage.getItem('med_url') || '', key: localStorage.getItem('med_key') || '' };
  } catch (e) { return { url: '', key: '' }; }
}
function zeigeZugang() {
  var z = zugang();
  $('z_url').value = z.url;
  $('z_key').value = z.key;
  $('z_abbruch').style.display = (z.url && z.key) ? '' : 'none';
  $('zugang').style.display = 'block';
}
function speichereZugang() {
  var url = $('z_url').value.trim(), key = $('z_key').value.trim();
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { meldung('Die URL muss auf /exec enden.', true); return; }
  if (!key) { meldung('Zugangsschlüssel fehlt.', true); return; }
  try {
    localStorage.setItem('med_url', url);
    localStorage.setItem('med_key', key);
  } catch (e) { meldung('Der Browser erlaubt kein Speichern (privater Modus?).', true); return; }
  $('zugang').style.display = 'none';
  laden();
}

/* ---- Server-Aufrufe ----
   Jeder Aufruf bekommt eine fortlaufende Nummer. Der Server garantiert nicht, dass Antworten in der Reihenfolge
   der Aufrufe ankommen. setState() verwirft deshalb Antworten, die älter sind als der zuletzt übernommene Stand. */
var callSeq = 0;
var lastAppliedSeq = 0;
var pendingMutations = 0;     // laufende bzw. wartende schreibende Aufrufe
var lastLocalAction = Date.now();

function rawCall(aktion, daten) {
  var z = zugang();
  if (!z.url || !z.key) { zeigeZugang(); return Promise.reject(new Error('Bitte zuerst den Zugang einrichten.')); }
  var seq = ++callSeq;
  // Bewusst KEIN Content-Type-Header (Standard text/plain): mit application/json würde der Browser einen
  // CORS-Preflight schicken, den Apps Script nicht beantwortet.
  return fetch(z.url, { method: 'POST', body: JSON.stringify({ key: z.key, aktion: aktion, daten: daten || {} }) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) throw new Error(j.fehler || 'Unbekannter Fehler');
      if (j.state && typeof j.state === 'object') j.state.__seq = seq;
      return j.state;
    })
    .catch(function (e) {
      if (e instanceof TypeError) throw new Error('Keine Verbindung zum Server. URL und Bereitstellung prüfen.');
      throw e;
    });
}

// Schreibende Aufrufe laufen strikt nacheinander, damit der Server die Änderungen in genau der Reihenfolge
// sieht, in der geklickt wurde. Lesende Aufrufe ('lade') laufen sofort und werden nicht eingereiht.
var mutationQueue = Promise.resolve();
function call(aktion, daten) {
  if (aktion === 'lade') return rawCall(aktion, daten);
  pendingMutations++;
  lastLocalAction = Date.now();
  planeAktualisierung();

  var settled = false;
  var done = function () {
    if (settled) return;
    settled = true;
    pendingMutations = Math.max(0, pendingMutations - 1);
  };
  var result = mutationQueue.then(function () { return rawCall(aktion, daten); });
  result.then(done, done);
  // Kette weiterlaufen lassen, auch wenn ein Aufruf scheitert oder hängt
  mutationQueue = new Promise(function (weiter) {
    var fertig = false;
    var einmal = function () { if (!fertig) { fertig = true; weiter(); } };
    result.then(einmal, einmal);
    setTimeout(function () { done(); einmal(); }, 20000);
  });
  return result;
}

/* ---- Eigene, noch unbestätigte Änderungen ----
   Jede Antwort enthält den kompletten Stand zum Zeitpunkt ihres Aufrufs. Eine frühere Antwort kennt spätere eigene
   Änderungen noch nicht und würde sie kurz zurücksetzen. Deshalb werden eigene Änderungen nach jeder Antwort wieder
   obenauf gelegt und erst entfernt, wenn ihre eigene Antwort da ist. */
var optimistic = {};      // id -> Feldänderungen
var optimisticStamp = {}; // id -> laufende Nummer der letzten Änderung
var optimisticNeu = {};   // id -> true, solange der Eintrag nur lokal existiert
var optimisticCounter = 0;
var geloescht = {};       // id -> true
var ordnungOverlay = null;   // { ids: [...], stamp }
var einstOverlay = null;     // { vorlauf, buendel, stamp }

function markOptimistic(id, patch, istNeu) {
  var cur = optimistic[id] || {};
  for (var k in patch) { if (patch.hasOwnProperty(k)) cur[k] = patch[k]; }
  optimistic[id] = cur;
  if (istNeu) optimisticNeu[id] = true;
  optimisticStamp[id] = ++optimisticCounter;
  return optimisticStamp[id];
}
function clearOptimistic(id, stamp) {
  if (optimisticStamp[id] === stamp) {
    delete optimistic[id]; delete optimisticStamp[id]; delete optimisticNeu[id];
  }
}
function applyOptimistic() {
  Object.keys(optimistic).forEach(function (id) {
    var patch = optimistic[id];
    var m = state.medikamente.filter(function (x) { return x.id === id; })[0];
    if (!m) {
      if (!optimisticNeu[id]) return;
      m = { id: id };
      state.medikamente.push(m);
    }
    for (var k in patch) { if (patch.hasOwnProperty(k)) m[k] = patch[k]; }
  });
}
function applyDeletions() {
  if (Object.keys(geloescht).length) {
    state.medikamente = state.medikamente.filter(function (m) { return !geloescht[m.id]; });
  }
}
function applyOrdnung() {
  if (!ordnungOverlay) return;
  var pos = {};
  ordnungOverlay.ids.forEach(function (id, i) { pos[id] = i + 1; });
  var rest = ordnungOverlay.ids.length;
  state.medikamente.forEach(function (m) { m.reihenfolge = pos[m.id] ? pos[m.id] : ++rest; });
}
function applyEinst() {
  if (!einstOverlay) return;
  state.einstellungen = { vorlauf: einstOverlay.vorlauf, buendel: einstOverlay.buendel };
}

function setState(s) {
  if (!s) return;
  if (typeof s.__seq === 'number') {
    if (s.__seq < lastAppliedSeq) return; // veraltete Antwort
    lastAppliedSeq = s.__seq;
  }
  state = s;
  applyDeletions();
  applyOptimistic();
  applyOrdnung();
  applyEinst();
  render();
}

// Nach einem fehlgeschlagenen Aufruf den echten Stand neu holen
function neuLaden() {
  call('lade').then(setState).catch(function () {});
}

function laden(versuche) {
  var n = versuche === undefined ? 2 : versuche;
  call('lade').then(function (s) {
    setState(s);
    planeAktualisierung();
  }).catch(function (e) {
    if (n > 0 && !/Zugangsschl|Zugang einrichten/.test(e.message)) { setTimeout(function () { laden(n - 1); }, 900); return; }
    $('liste').textContent = 'Daten konnten nicht geladen werden.';
    fehler(e);
    if (/Zugangsschl/.test(e.message)) zeigeZugang();
  });
}

/* ---- Datum ---- */
function tagNr(s) {
  var a = s.split('-').map(Number);
  return Math.round(Date.UTC(a[0], a[1] - 1, a[2]) / 86400000);
}
function nrDatum(nr) {
  var d = new Date(nr * 86400000);
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
}
function tageBis(frist) {
  return frist ? tagNr(frist) - tagNr(state.heute) : null;
}
function datumDe(frist) {
  var a = frist.split('-');
  return a[2] + '.' + a[1] + '.' + a[0];
}
function addTage(datum, n) { return nrDatum(tagNr(datum) + n); }
// Monate addieren, Tag bleibt erhalten oder rückt auf den letzten Tag des Monats (31.08. + 6 Monate = 28.02.)
function addMonate(datum, n) {
  var a = datum.split('-').map(Number);
  var t = new Date(Date.UTC(a[0], a[1] - 1 + n, 1));
  var letzter = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
  return t.getUTCFullYear() + '-' + String(t.getUTCMonth() + 1).padStart(2, '0') + '-' + String(Math.min(a[2], letzter)).padStart(2, '0');
}
var WOCHENTAGE = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
function tagTitel(datum) {
  return WOCHENTAGE[new Date(tagNr(datum) * 86400000).getUTCDay()] + ' ' + datumDe(datum);
}

/* ---- Einheiten: Gruppen zusammenfassen ---- */
function artVon(m) { return m.art === 'aufgabe' || m.art === 'termin' ? m.art : 'rezept'; }

function einheiten() {
  var map = {}, liste = [];
  state.medikamente.forEach(function (m) {
    var key = m.gruppe ? 'g:' + m.gruppe : 'i:' + m.id;
    if (!map[key]) { map[key] = { key: key, name: m.gruppe || m.name, mitglieder: [], gruppe: !!m.gruppe }; liste.push(map[key]); }
    map[key].mitglieder.push(m);
  });
  liste.forEach(function (u) {
    var aktive = u.mitglieder.filter(function (m) { return m.aktiv; });
    u.aktiv = aktive.length > 0;
    var basis = u.aktiv ? aktive : u.mitglieder;
    var rez = basis.filter(function (m) { return artVon(m) === 'rezept'; });
    u.rezept = u.mitglieder.some(function (m) { return artVon(m) === 'rezept'; });   // gehört in den Bereich "Rezepte"
    u.hatText = basis.some(function (m) { return !!m.text; });
    // nächste Frist: früheste Frist, vergangene Termine zählen nicht mehr
    var kand = basis.filter(function (m) { return m.frist && !(artVon(m) === 'termin' && m.frist < state.heute); })
      .sort(function (x, y) { return x.frist < y.frist ? -1 : x.frist > y.frist ? 1 : 0; });
    u.fruehestes = kand[0] || null;
    u.frist = u.fruehestes ? u.fruehestes.frist : '';
    u.vergangen = !u.frist && basis.some(function (m) { return artVon(m) === 'termin' && m.frist; });
    // Kalenderbalken: nur Rezepte, Beginn bis frühestes Fristende
    var beginne = rez.filter(function (m) { return m.beginn; }).map(function (m) { return m.beginn; }).sort();
    u.beginn = beginne.length ? beginne[0] : '';
    var rfr = rez.filter(function (m) { return m.frist; }).map(function (m) { return m.frist; }).sort();
    u.rezeptFrist = rfr.length ? rfr[0] : '';
    // Dosierung: nur Rezepte
    var dosen = [];
    rez.forEach(function (m) { if (m.dosierung && dosen.indexOf(m.dosierung) < 0) dosen.push(m.dosierung); });
    if (dosen.length <= 1) u.dosis = dosen[0] || '';
    else u.dosis = rez.filter(function (m) { return m.dosierung; }).map(function (m) { return m.name + ': ' + m.dosierung; }).join('\n');
    u.aktiveIds = basis.map(function (m) { return m.id; });
    u.rezeptIds = rez.map(function (m) { return m.id; });
    u.aufgabeIds = basis.filter(function (m) { return artVon(m) === 'aufgabe'; }).map(function (m) { return m.id; });
  });
  return liste;
}
function statusKlasse(u) {
  var d = tageBis(u.frist);
  if (d === null) return '';
  return d < 0 ? 'rot' : d <= state.einstellungen.vorlauf + state.einstellungen.buendel ? 'orange' : 'gruen';
}
function relativ(d, art) {
  if (d < 0) return 'seit ' + (-d) + ' Tagen ' + (art === 'rezept' ? 'abgelaufen' : 'überfällig');
  return d === 0 ? 'heute' : 'in ' + d + ' Tagen';
}
function fristZeile(u) {
  var m = u.fruehestes;
  if (!m) return u.vergangen ? 'Termin vergangen' : 'keine Frist hinterlegt';
  var art = artVon(m), d = tageBis(m.frist), rel = relativ(d, art), dat = datumDe(m.frist);
  if (art === 'termin') return 'Termin · ' + dat + (m.von ? ', ' + m.von : '') + ' · ' + rel;
  if (art === 'aufgabe') return (u.gruppe ? m.name + ' bis ' : 'Aufgabe · fällig ') + dat + ' · ' + rel;
  return 'Frist ' + dat + ' · ' + rel;
}

/* ---- Kalender ---- */
var kalender = { jahr: null, monat: null, tag: null };
var letzteKalender = '';
var MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
var FARBEN = {
  rot: ['#e8a09b', '#4a0e0b'],
  orange: ['#f4b860', '#3d2800'],
  gruen: ['#9fd3a2', '#123514']
};
var MAX_LANES = 2;
var ZEILE_H = 82;
var BLAU = '#1f4e79', LILA = '#7b3fa0';

function kalenderMonat(delta) {
  var d = new Date(Date.UTC(kalender.jahr, kalender.monat + delta, 1));
  kalender.jahr = d.getUTCFullYear();
  kalender.monat = d.getUTCMonth();
  renderKalender();
}

// Einträge pro Tag: Termine/Kalendereinträge (Kreis) und fällige Aufgaben (Quadrat)
function tagesEintraege() {
  var map = {};
  function add(datum, e) { (map[datum] = map[datum] || []).push(e); }
  var kalVerbunden = state.kalender && state.kalender.verbunden;
  if (kalVerbunden) {
    (state.ereignisse || []).forEach(function (ev) {
      add(ev.datum, { art: 'termin', titel: ev.titel, von: ev.von, bis: ev.bis, ort: ev.ort, quelle: 'Google Kalender' });
    });
  } else {
    // Ohne Kalender-Verbindung die Termine aus der App zeigen
    state.medikamente.forEach(function (m) {
      if (artVon(m) === 'termin' && m.aktiv && m.frist) add(m.frist, { art: 'termin', titel: m.name, von: m.von, bis: m.bis, ort: m.ort, quelle: 'App' });
    });
  }
  state.medikamente.forEach(function (m) {
    if (artVon(m) === 'aufgabe' && m.aktiv && m.frist) add(m.frist, { art: 'aufgabe', titel: m.name, von: '', bis: '', ort: '', quelle: 'Aufgabe' });
  });
  return map;
}

function renderKalender() {
  var box = $('kalender');
  if (!state.heute) { box.style.display = 'none'; return; }
  box.style.display = '';
  if (kalender.jahr === null) {
    var t = state.heute.split('-').map(Number);
    kalender.jahr = t[0]; kalender.monat = t[1] - 1;
  }
  if (!kalender.tag) kalender.tag = state.heute;
  var heuteNr = tagNr(state.heute);
  var ersterNr = Math.round(Date.UTC(kalender.jahr, kalender.monat, 1) / 86400000);
  var tageImMonat = new Date(Date.UTC(kalender.jahr, kalender.monat + 1, 0)).getUTCDate();
  var versatz = (new Date(ersterNr * 86400000).getUTCDay() + 6) % 7; // Montag = 0
  var wochen = Math.ceil((versatz + tageImMonat) / 7);
  var startNr = ersterNr - versatz;
  var endeNr = startNr + wochen * 7 - 1;
  var einst = state.einstellungen;
  var eintraege = tagesEintraege();

  // Ein Balken je Rezept-Einheit: Beginn bis frühestes Fristende
  var balken = einheiten().filter(function (u) {
    return u.aktiv && u.beginn && u.rezeptFrist && tagNr(u.rezeptFrist) >= tagNr(u.beginn);
  }).map(function (u) {
    var von = tagNr(u.beginn), bis = tagNr(u.rezeptFrist), d = bis - heuteNr;
    var klasse = d < 0 ? 'rot' : d <= einst.vorlauf + einst.buendel ? 'orange' : 'gruen';
    return { name: u.name, von: von, bis: bis, erinn: bis - einst.vorlauf, farbe: FARBEN[klasse], lane: -1 };
  }).filter(function (b) { return b.bis >= startNr && b.von <= endeNr; })
    .sort(function (a, b) { return a.von - b.von || a.name.localeCompare(b.name); });

  // Bahnen im sichtbaren Bereich einmal fest vergeben, damit ein Balken über alle Wochen auf derselben Höhe bleibt
  var bahnEnde = [];
  balken.forEach(function (b) {
    var l = 0;
    while (l < bahnEnde.length && bahnEnde[l] >= b.von) l++;
    bahnEnde[l] = b.bis;
    b.lane = l;
  });

  var kopf = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
    '<button class="sek" aria-label="Vorheriger Monat" onclick="kalenderMonat(-1)" style="width:40px;height:36px;font-size:18px;padding:0">‹</button>' +
    '<h2 style="font-size:16px;margin:0">' + MONATE[kalender.monat] + ' ' + kalender.jahr + '</h2>' +
    '<button class="sek" aria-label="Nächster Monat" onclick="kalenderMonat(1)" style="width:40px;height:36px;font-size:18px;padding:0">›</button></div>';
  var tage = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(function (n) {
    return '<div style="flex:1;text-align:center;font-size:12px;color:#5f6368;padding:4px 0">' + n + '</div>';
  }).join('');

  var zeilen = '';
  for (var w = 0; w < wochen; w++) {
    var wStart = startNr + w * 7, wEnde = wStart + 6;
    var zellen = '', marker = '';
    for (var c = 0; c < 7; c++) {
      var nr = wStart + c, dd = new Date(nr * 86400000), datum = nrDatum(nr);
      var imMonat = dd.getUTCMonth() === kalender.monat;
      var num = nr === heuteNr
        ? '<span style="display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:#1f4e79;color:#fff;font-size:12px">' + dd.getUTCDate() + '</span>'
        : '<span style="font-size:12px;color:' + (imMonat ? '#1c1e21' : '#6b7077') + '">' + dd.getUTCDate() + '</span>';
      var sel = datum === kalender.tag ? 'background:#e8f0f8;' : '';
      zellen += '<div data-a="tag" data-d="' + datum + '" style="flex:1;padding:2px 3px;border-right:1px solid #eceef1;box-sizing:border-box;cursor:pointer;' + sel + '">' + num + '</div>';
      var es = eintraege[datum] || [];
      var arten = [];
      if (es.some(function (x) { return x.art === 'termin'; })) arten.push('termin');
      if (es.some(function (x) { return x.art === 'aufgabe'; })) arten.push('aufgabe');
      // Marker mittig in der Spalte dieses Tages
      arten.forEach(function (art, i) {
        var form = art === 'termin' ? 'border-radius:50%;background:' + BLAU : 'border-radius:2px;background:' + LILA;
        marker += '<div style="position:absolute;left:calc(' + ((c + 0.5) / 7 * 100) + '% + ' + ((i - (arten.length - 1) / 2) * 11 - 4) + 'px);top:' + (ZEILE_H - 14) + 'px;width:8px;height:8px;' + form + '"></div>';
      });
    }
    var innen = '', ueberlauf = 0;
    balken.forEach(function (b) {
      if (b.bis < wStart || b.von > wEnde) return;
      if (b.lane >= MAX_LANES) { ueberlauf++; return; }
      var c0 = Math.max(b.von, wStart) - wStart, c1 = Math.min(b.bis, wEnde) - wStart;
      var lo = b.von < wStart, ro = b.bis > wEnde;
      var rl = lo ? '0' : '9px', rr = ro ? '0' : '9px';
      innen += '<div style="position:absolute;left:calc(' + (c0 / 7 * 100) + '% + 1px);width:calc(' + ((c1 - c0 + 1) / 7 * 100) + '% - 2px);top:' + (24 + b.lane * 20) +
        'px;height:18px;box-sizing:border-box;padding:0 6px;background:' + b.farbe[0] + ';color:' + b.farbe[1] +
        ';font-size:11px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:' + rl + ' ' + rr + ' ' + rr + ' ' + rl + '">' + esc(b.name) + '</div>';
      if (b.erinn >= Math.max(b.von, wStart) && b.erinn <= Math.min(b.bis, wEnde)) {
        innen += '<div style="position:absolute;left:calc(' + ((b.erinn - wStart + 0.5) / 7 * 100) + '% - 4px);top:' + (24 + b.lane * 20 + 5) +
          'px;width:8px;height:8px;box-sizing:border-box;border-radius:50%;background:#fff;border:2px solid ' + b.farbe[1] + '"></div>';
      }
    });
    if (ueberlauf > 0) {
      innen += '<div style="position:absolute;right:3px;top:3px;font-size:11px;color:#5f6368">+' + ueberlauf + '</div>';
    }
    zeilen += '<div style="position:relative;height:' + ZEILE_H + 'px;border-top:1px solid #e3e6ea;display:flex">' + zellen +
      '<div style="position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none">' + innen + marker + '</div></div>';
  }

  // Einträge des gewählten Tages
  var es = (eintraege[kalender.tag] || []).slice().sort(function (x, y) { return (x.von || '') < (y.von || '') ? -1 : 1; });
  var liste = es.length ? es.map(function (x) {
    var m = x.art === 'termin' ? 'border-radius:50%;background:' + BLAU : 'border-radius:2px;background:' + LILA;
    var zeit = x.von ? '<b>' + esc(x.von) + '</b> ' : '';
    var zusatz = [x.ort ? esc(x.ort) : '', esc(x.quelle)].filter(Boolean).join(' · ');
    return '<div class="te"><span class="m" style="' + m + '"></span><span>' + zeit + esc(x.titel) + ' <span style="color:#5f6368">· ' + zusatz + '</span></span></div>';
  }).join('') : '<div class="te" style="color:#5f6368">Keine Einträge</div>';
  var tagesliste = '<div class="tagesliste"><div class="tk">' + tagTitel(kalender.tag) + '</div>' + liste + '</div>';

  var legende = '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:#5f6368">' +
    '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + BLAU + '"></span> Termin' +
    '&nbsp;&nbsp;<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:' + LILA + '"></span> Aufgabe' +
    '&nbsp;&nbsp;<span style="display:inline-block;width:8px;height:8px;box-sizing:border-box;border-radius:50%;background:#fff;border:2px solid #3d2800"></span> Erinnerungstag</div>';
  var html = kopf + '<div style="display:flex">' + tage + '</div><div style="border-bottom:1px solid #e3e6ea">' + zeilen + '</div>' + tagesliste + legende;
  if (html === letzteKalender) return;
  letzteKalender = html;
  box.innerHTML = html;
}

var INFO_SVG = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="#5f6368" stroke-width="1.5"></circle><path d="M8 7.2v3.6" stroke="#5f6368" stroke-width="1.5" stroke-linecap="round"></path><circle cx="8" cy="4.9" r="0.9" fill="#5f6368"></circle></svg>';

    '" fill="none" stroke="#5f6368" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
}
function wert(label, text) {

}
var ART_NAME = { rezept: 'Rezept', aufgabe: 'Aufgabe', termin: 'Termin' };

// Detailzeilen je Art. mitDatum = false bei Einzelkarten, deren Datum schon in der Kopfzeile steht
function mitgliedZeilen(m, mitDatum) {
  var art = artVon(m), z = '';
  if (art === 'rezept') {

  } else if (art === 'aufgabe') {
    if (mitDatum && m.frist) z += wert('Fällig', datumDe(m.frist));
    z += m.wiederholung ? wert('Wiederholung', 'alle ' + m.wiederholung + (m.wiederholung === 1 ? ' Monat' : ' Monate')) : '';
    z += m.text ? wert('Mail-Text', m.text) : '';
  } else {
    if (mitDatum && m.frist) z += wert('Wann', tagTitel(m.frist) + (m.von ? ', ' + m.von + (m.bis ? ' bis ' + m.bis : '') : ''));
    z += m.ort ? wert('Ort', m.ort) : '';

var dragAktiv = false;       // während des Ziehens und kurz nach einer Tastatur-Verschiebung kein Neuaufbau

// Reihenfolge der Karten: die der Einheit mit der kleinsten Reihenfolge ihrer Mitglieder
function sortierteEinheiten() {
  var liste = einheiten();
  liste.forEach(function (u) {
    u.mitglieder.sort(function (a, b) { return (a.reihenfolge || 0) - (b.reihenfolge || 0); });
    u.reihe = Math.min.apply(null, u.mitglieder.map(function (m) { return m.reihenfolge || 0; }));
  });
  return liste.sort(function (x, y) { return x.reihe - y.reihe; });
}

function karteHtml(u) {
  var auf = !!offen[u.key], k = esc(u.key);

// Eingabefelder für Vorlauf/Bündelung nur überschreiben, wenn sich der Wert auf dem Server geändert hat
// und das Feld nicht gerade bearbeitet wird. So geht Getipptes nicht verloren.
var einstGesetzt = null;

  var e = state.einstellungen;
  if (!(einstGesetzt && einstGesetzt.vorlauf === e.vorlauf && einstGesetzt.buendel === e.buendel)) {
    if (document.activeElement !== $('vorlauf')) $('vorlauf').value = e.vorlauf;

var letzteGruppen = '';

function klickListe(e) {

/* ---- Ziehen zum Sortieren (wie Ziele in Google Maps) ----
   Pointer Events: Maus und Touch. Gezogen wird innerhalb eines Bereichs (Rezepte bzw. Aufgaben & Termine).
   Beim Loslassen wird die Reihenfolge aus dem DOM gelesen und sofort gespeichert. */
var activeDrag = null;
var autoScrollTimer = null;

function listeReihenfolge(container) {
  return Array.prototype.slice.call(container.children).map(function (r) { return r.dataset.key; }).filter(Boolean);
}

function pointerdownListe(e) {
  var griff = e.target.closest('.griff');
  if (!griff) return;
  if (activeDrag) return;
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  var li = griff.closest('.karte');
  var container = li.parentNode;
  activeDrag = { li: li, ul: container, handle: griff, pointerId: e.pointerId, y: e.clientY, startOrder: listeReihenfolge(container).join('\u0001') };
  dragAktiv = true;
  li.classList.add('dragging');
  try { griff.setPointerCapture(e.pointerId); } catch (err) {}
  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', endDrag);
  // pointercancel feuert z. B., wenn der Browser die Geste als Scrollen übernimmt
  document.addEventListener('pointercancel', endDrag);
  window.addEventListener('blur', endDrag);
  autoScrollTimer = setInterval(autoScrollStep, 40);
}
$('liste').addEventListener('pointerdown', pointerdownListe);
$('listeAT').addEventListener('pointerdown', pointerdownListe);

function platziere(y) {
  var d = activeDrag;
  if (!d) return;
  var ul = d.ul;
  var zeilen = Array.prototype.slice.call(ul.children).filter(function (r) { return r !== d.li; });
  for (var i = 0; i < zeilen.length; i++) {
    var rect = zeilen[i].getBoundingClientRect();
    if (y < rect.top + rect.height / 2) { ul.insertBefore(d.li, zeilen[i]); return; }
  }
  ul.appendChild(d.li);
}
function onDragMove(ev) {
  if (!activeDrag) return;
  if (!document.contains(activeDrag.li)) { endDrag(); return; }
  if (ev.cancelable) ev.preventDefault();
  activeDrag.y = ev.clientY;
  platziere(ev.clientY);
}
// Am oberen/unteren Rand mitscrollen
function autoScrollStep() {
  if (!activeDrag) return;
  var y = activeDrag.y, zone = 70, delta = 0;
  if (y < zone) delta = -Math.max(6, (zone - y) / 3);
  else if (y > window.innerHeight - zone) delta = Math.max(6, (y - (window.innerHeight - zone)) / 3);
  if (delta) { window.scrollBy(0, delta); platziere(y); }
}
function endDrag() {
  var d = activeDrag;
  if (!d) return;
  activeDrag = null;
  clearInterval(autoScrollTimer);
  autoScrollTimer = null;
  d.li.classList.remove('dragging');
  try { d.handle.releasePointerCapture(d.pointerId); } catch (err) {}
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', endDrag);
  document.removeEventListener('pointercancel', endDrag);
  window.removeEventListener('blur', endDrag);
  dragAktiv = false;
  var neu = listeReihenfolge(d.ul);
  if (neu.join('\u0001') === d.startOrder) { if (renderAusstehend) render(); return; }
  speichereReihenfolge();
}

// Tastatur: Pfeil hoch/runter am Griff verschiebt die Karte um eine Position
function keydownListe(e) {
  var griff = e.target.closest ? e.target.closest('.griff') : null;
  if (!griff || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  e.preventDefault();
  var li = griff.closest('.karte'), ul = li.parentNode;
  if (e.key === 'ArrowUp' && li.previousElementSibling) ul.insertBefore(li, li.previousElementSibling);
  else if (e.key === 'ArrowDown' && li.nextElementSibling) ul.insertBefore(li.nextElementSibling, li);
  else return;
  griff.focus();
  clearTimeout(tastaturTimer);
  tastaturTimer = setTimeout(function () {
    tastaturTimer = null;
    speichereReihenfolge();
  }, 600);
}
$('liste').addEventListener('keydown', keydownListe);
$('listeAT').addEventListener('keydown', keydownListe);

// Gesamtreihenfolge: erst der Bereich Rezepte, dann Aufgaben & Termine, jeweils wie in der Anzeige
function speichereReihenfolge() {
  var schluessel = listeReihenfolge($('liste')).concat(listeReihenfolge($('listeAT')));
  var ids = [];
  schluessel.forEach(function (k) {
    var u = findeEinheit(k);
    if (u) u.mitglieder.forEach(function (m) { ids.push(m.id); });
  });
  var stamp = ++optimisticCounter;
  ordnungOverlay = { ids: ids, stamp: stamp };
  applyOrdnung();          // sofort lokal übernehmen
  letzteListe = ''; letzteListeAT = '';   // DOM nach dem Ziehen einmal sicher aus dem Stand neu aufbauen
  render();
  call('reihenfolge', { ids: ids }).then(function (s) {
    if (ordnungOverlay && ordnungOverlay.stamp === stamp) ordnungOverlay = null;
    setState(s);
  }).catch(function (e) {
    if (ordnungOverlay && ordnungOverlay.stamp === stamp) ordnungOverlay = null;
    fehler(e); neuLaden();
  });
}

/* ---- Formular ---- */
function finde(id) {
  return state.medikamente.filter(function (m) { return m.id === id; })[0];
}
function formularOffen() {
  return $('overlay').style.display === 'block' || $('zugang').style.display === 'block';
}

// Zeigt nur die Felder, die zur gewählten Art gehören
function setzeArt(art) {
  $('f_art').value = art;
  Array.prototype.forEach.call(document.querySelectorAll('#artWahl button'), function (b) {
    b.setAttribute('aria-pressed', b.getAttribute('data-art') === art ? 'true' : 'false');
  });
  Array.prototype.forEach.call(document.querySelectorAll('#formular [data-for]'), function (el) {
    el.style.display = el.getAttribute('data-for').split(' ').indexOf(art) >= 0 ? '' : 'none';
  });
  $('l_name').textContent = art === 'rezept' ? 'Medikament' : 'Titel';
  $('l_frist').textContent = art === 'rezept' ? 'Fristende' : art === 'aufgabe' ? 'Fällig am' : 'Datum';
  $('l_text').textContent = art === 'aufgabe' ? 'Mail-Text an das KID (optional)' : 'Text für die Mail an das KID (z. B. "1x 100 Stück ...")';
}
document.querySelector('#artWahl').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-art]');
  if (b) setzeArt(b.getAttribute('data-art'));
});

function fuelle(m) {
  var art = artVon(m);
  $('f_id').value = m.id || '';
  $('f_name').value = m.name || '';
  $('f_gruppe').value = m.gruppe || '';
  $('f_dosierung').value = m.dosierung || '';
  $('f_text').value = m.text || '';
  $('f_beginn').value = m.beginn || '';
  $('f_frist').value = m.frist || '';
  $('f_reichweite').value = m.reichweite === undefined ? '' : m.reichweite;
  $('f_wiederholung').value = m.wiederholung === undefined ? '' : m.wiederholung;
  $('f_von').value = m.von || '';
  $('f_bis').value = m.bis || '';
  $('f_ort').value = m.ort || '';
  var vb = m.vorbereitung;
  $('f_vb_aktiv').checked = vb ? !!vb.aktiv : false;
  $('f_vb_titel').value = vb ? vb.titel : 'Überweisung einholen';
  $('f_vb_tage').value = vb ? vb.tage : 14;
  $('f_vb_text').value = vb ? vb.text : '';
  $('f_foto').checked = !!m.foto;
  $('f_aktiv').checked = m.aktiv !== false;
  $('f_notiz').value = m.notiz || '';
  setzeArt(art);
  $('overlay').style.display = 'block';
}
function neu() {
  $('formTitel').textContent = 'Neu';
  $('btnLoeschen').style.display = 'none';
  $('artWahl').style.display = '';
  fuelle({});
}
function bearbeite(id) {
  $('formTitel').textContent = 'Bearbeiten';
  $('btnLoeschen').style.display = '';
  $('artWahl').style.display = 'none';       // die Art eines bestehenden Eintrags bleibt fest
  fuelle(finde(id));
}
function schliesse() { $('overlay').style.display = 'none'; }

function neueId() {
  return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
}
function hoechsteReihenfolge() {
  var h = 0;
  state.medikamente.forEach(function (x) { if ((x.reihenfolge || 0) > h && x.reihenfolge < 100000) h = x.reihenfolge; });
  return h;
}

// Speichern wirkt sofort in der Oberfläche; der Server-Aufruf läuft im Hintergrund.
function speichere() {
  var art = $('f_art').value;
  var m = {
    id: $('f_id').value,
    art: art,
    name: $('f_name').value.trim(),
    gruppe: $('f_gruppe').value.trim(),
    dosierung: art === 'rezept' ? $('f_dosierung').value.trim() : '',
    text: art === 'termin' ? '' : $('f_text').value.trim(),
    beginn: art === 'rezept' ? $('f_beginn').value : '',
    frist: $('f_frist').value,
    reichweite: art === 'rezept' && $('f_reichweite').value !== '' ? Number($('f_reichweite').value) : '',
    wiederholung: art === 'aufgabe' && $('f_wiederholung').value !== '' ? Number($('f_wiederholung').value) : '',
    von: art === 'termin' ? $('f_von').value : '',
    bis: art === 'termin' ? $('f_bis').value : '',
    ort: art === 'termin' ? $('f_ort').value.trim() : '',
    foto: art === 'rezept' && $('f_foto').checked,
    aktiv: $('f_aktiv').checked,
    notiz: $('f_notiz').value.trim()
  };
  var vb = null;
  if (art === 'termin') {
    vb = { aktiv: $('f_vb_aktiv').checked, titel: $('f_vb_titel').value.trim() || 'Vorbereitung',
           tage: Number($('f_vb_tage').value) || 0, text: $('f_vb_text').value.trim() };
    m.vorbereitung = vb;
  }
  if (!m.name) { meldung('Name fehlt.', true); return; }
  if (art === 'rezept' && !m.text) { meldung('Text für die Mail fehlt.', true); return; }
  if (art !== 'rezept' && !m.frist) { meldung(art === 'termin' ? 'Datum fehlt.' : 'Fälligkeitsdatum fehlt.', true); return; }
  if (art === 'termin' && m.bis && m.von && m.bis < m.von) { meldung('Die Endzeit liegt vor der Startzeit.', true); return; }

  var istNeu = !m.id;
  var hoechste = hoechsteReihenfolge();
  if (istNeu) { m.id = neueId(); m.reihenfolge = hoechste + 1; }
  // Gleiche Regel wie auf dem Server: aktive Vorbereitung ohne Gruppe -> Gruppe = Titel des Termins
  var gruppe = m.gruppe || (vb && vb.aktiv ? m.name : '');
  m.gruppe = gruppe;
  var patch = {};
  for (var k in m) { if (m.hasOwnProperty(k) && k !== 'id') patch[k] = m[k]; }
  if (!istNeu) delete patch.reihenfolge;
  var stamps = {};
  stamps[m.id] = markOptimistic(m.id, patch, istNeu);

  // Vorbereitungs-Aufgabe mitführen (ID = "v-" + Termin-ID)
  var cid = 'v-' + m.id;
  var companion = null;
  if (art === 'termin') {
    if (vb.aktiv) {
      var vorhanden = finde(cid);
      var cp = { art: 'aufgabe', name: vb.titel, text: vb.text, frist: addTage(m.frist, -vb.tage), gruppe: gruppe, dosierung: '', notiz: '',
                 beginn: '', reichweite: '', wiederholung: '', von: '', bis: '', ort: '', foto: false };
      if (!vorhanden) { cp.aktiv = m.aktiv; cp.reihenfolge = hoechste + (istNeu ? 2 : 1); }
      stamps[cid] = markOptimistic(cid, cp, !vorhanden);
      companion = cid;
    } else if (finde(cid)) {
      geloescht[cid] = true;
      companion = cid;
    }
  }
  schliesse();
  applyDeletions(); applyOptimistic();
  render();
  call('speichere', { medikament: m }).then(function (s) {
    Object.keys(stamps).forEach(function (id) { clearOptimistic(id, stamps[id]); });
    if (companion) delete geloescht[companion];
    setState(s);
    if (s && s.hinweis) meldung(s.hinweis, true); else meldung('Gespeichert');
  }).catch(function (e) {
    Object.keys(stamps).forEach(function (id) { clearOptimistic(id, stamps[id]); });
    if (companion) delete geloescht[companion];
    fehler(e); neuLaden();
  });
}

function loesche() {
  var m = finde($('f_id').value);
  if (!m || !confirm('"' + m.name + '" wirklich löschen?' + (artVon(m) === 'termin' ? ' Der Eintrag im Google Kalender und die zugehörige Aufgabe werden ebenfalls gelöscht.' : ''))) return;
  var ids = [m.id];
  if (artVon(m) === 'termin' && finde('v-' + m.id)) ids.push('v-' + m.id);
  ids.forEach(function (i) { geloescht[i] = true; });
  schliesse();
  applyDeletions();
  render();
  call('loesche', { id: m.id }).then(function (s) {
    ids.forEach(function (i) { delete geloescht[i]; });
    setState(s);
    if (s && s.hinweis) meldung(s.hinweis, true); else meldung('Gelöscht');
  }).catch(function (e) {
    ids.forEach(function (i) { delete geloescht[i]; });
    fehler(e); neuLaden();
  });
}

/* ---- Aktionen je Einheit (Einzelmedikament oder Gruppe) ---- */
function lieferung(key) {
  var u = findeEinheit(key);
  var ms = u.mitglieder.filter(function (m) { return m.aktiv && artVon(m) === 'rezept'; });
  var ohne = ms.filter(function (m) { return !m.reichweite; });
  if (ohne.length) {
    meldung('Bitte zuerst eine Reichweite (Tage) hinterlegen: ' + ohne.map(function (m) { return m.name; }).join(', '), true);
    return;
  }
  var frage = u.gruppe
    ? 'Neue Lieferung für "' + u.name + '" (' + ms.map(function (m) { return m.name; }).join(', ') + '): Beginn auf heute, Fristende je Medikament auf heute + Reichweite setzen?'
    : 'Neue Lieferung für "' + u.name + '": Beginn auf heute und Fristende auf heute + ' + ms[0].reichweite + ' Tage setzen?';
  if (!confirm(frage)) return;
  var stamps = {};
  ms.forEach(function (m) {
    stamps[m.id] = markOptimistic(m.id, { beginn: state.heute, frist: addTage(state.heute, Number(m.reichweite)) });
  });
  applyOptimistic();
  render();
  call('lieferung', { ids: ms.map(function (m) { return m.id; }) }).then(function (s) {
    ms.forEach(function (m) { clearOptimistic(m.id, stamps[m.id]); });
    setState(s);
    meldung('Neue Lieferung eingetragen');
  }).catch(function (e) {
    ms.forEach(function (m) { clearOptimistic(m.id, stamps[m.id]); });
    fehler(e); neuLaden();
  });
}

// "Erledigt": mit Wiederholung rückt das Datum um die Monate weiter, sonst wird die Aufgabe inaktiv
function erledigt(ids, name) {
  var ms = ids.map(finde).filter(function (m) { return m && m.aktiv && artVon(m) === 'aufgabe'; });
  if (!ms.length) { meldung('Keine offene Aufgabe.', true); return; }
  var stamps = {};
  ms.forEach(function (m) {
    var n = Number(m.wiederholung);
    var patch;
    if (n > 0) {
      var naechste = m.frist ? addMonate(m.frist, n) : addMonate(state.heute, n);
      if (naechste <= state.heute) naechste = addMonate(state.heute, n);
      patch = { frist: naechste };
    } else {
      patch = { aktiv: false };
    }
    stamps[m.id] = markOptimistic(m.id, patch);
  });
  applyOptimistic();
  render();
  meldung('Erledigt');
  call('erledigt', { ids: ms.map(function (m) { return m.id; }) }).then(function (s) {
    ms.forEach(function (m) { clearOptimistic(m.id, stamps[m.id]); });
    setState(s);
  }).catch(function (e) {
    ms.forEach(function (m) { clearOptimistic(m.id, stamps[m.id]); });
    fehler(e); neuLaden();
  });
}

function einzelmail(key) {
  var u = findeEinheit(key);
  if (!confirm('Mail für "' + u.name + '" jetzt an deine Outlook-Adresse senden?')) return;
  meldung('Mail wird gesendet …');
  call('einzelmail', { ids: u.aktiveIds }).then(function (s) {
    setState(s);
    meldung('Mail für "' + u.name + '" gesendet');
  }).catch(fehler);
}

function kalenderAbgleich() {
  meldung('Kalender wird abgeglichen …');
  call('kalender').then(function (s) {
    setState(s);
    meldung(s && s.kalender && s.kalender.verbunden ? 'Kalender abgeglichen' : 'Kalender nicht erreichbar', !(s && s.kalender && s.kalender.verbunden));
  }).catch(fehler);
}

function speichereEinst() {
  var v = Number($('vorlauf').value), b = Number($('buendel').value);
  if (isNaN(v) || isNaN(b) || v < 0 || b < 0 || $('vorlauf').value === '' || $('buendel').value === '') {
    meldung('Bitte gültige Zahlen eingeben.', true); return;
  }
  var stamp = ++optimisticCounter;
  einstOverlay = { vorlauf: v, buendel: b, stamp: stamp };
  einstGesetzt = { vorlauf: v, buendel: b };
  applyEinst();
  render();
  meldung('Einstellungen gespeichert');
  call('einstellungen', { vorlauf: v, buendel: b }).then(function (s) {
    if (einstOverlay && einstOverlay.stamp === stamp) einstOverlay = null;
    setState(s);
  }).catch(function (e) {
    if (einstOverlay && einstOverlay.stamp === stamp) einstOverlay = null;
    fehler(e); neuLaden();
  });
}

function testmail() {
  meldung('Testmail wird gesendet …');
  call('testmail').then(function (s) { setState(s); meldung('Testmail gesendet'); }).catch(fehler);
}

/* ---- Automatische Aktualisierung ----
   Kein fester Takt: solange jemand aktiv ist, wird häufiger aktualisiert, danach seltener. Im Hintergrund wird gar
   nicht aktualisiert. Es wird nie dazwischengefunkt: nicht während eine Änderung unterwegs ist, nicht beim
   Ziehen und nicht, solange ein Formular offen ist. */
var POLL_ACTIVE = 10000;
var POLL_IDLE = 60000;
var ACTIVE_WINDOW = 180000;
var refreshTimer = null;
var lastRefreshStart = 0;

function planeAktualisierung() {
  clearTimeout(refreshTimer);
  var idle = (Date.now() - lastLocalAction) > ACTIVE_WINDOW;
  refreshTimer = setTimeout(fuehreAktualisierungAus, idle ? POLL_IDLE : POLL_ACTIVE);
}

function stoert() {
  return document.hidden || pendingMutations > 0 || dragAktiv || tastaturTimer || formularOffen();
}

function fuehreAktualisierungAus() {
  if (stoert()) { planeAktualisierung(); return; }
  lastRefreshStart = Date.now();
  call('lade').then(function (s) {
    setState(s);
    planeAktualisierung();
  }).catch(function () { planeAktualisierung(); });
}

function sofortAktualisieren() {
  if (stoert()) return;
  if (Date.now() - lastRefreshStart < 1500) return;
  clearTimeout(refreshTimer);
  fuehreAktualisierungAus();
}

document.addEventListener('visibilitychange', function () {
  if (document.hidden) { clearTimeout(refreshTimer); return; }
  lastLocalAction = Date.now();
  sofortAktualisieren();
  planeAktualisierung();
});
window.addEventListener('focus', sofortAktualisieren);

if (zugang().url && zugang().key) { laden(); } else { zeigeZugang(); }
